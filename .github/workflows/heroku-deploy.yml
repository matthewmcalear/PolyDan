name: Deploy to Heroku

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
        
      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
        run: |
          HEROKU_EMAIL=$(curl -s -H "Authorization: Bearer ${HEROKU_API_KEY}" -H "Accept: application/vnd.heroku+json; version=3" https://api.heroku.com/account | jq -r '.email')
          echo "Retrieved email: ${HEROKU_EMAIL}"
          if [ -z "$HEROKU_EMAIL" ] || [ "$HEROKU_EMAIL" = "null" ]; then
            echo "ERROR: Could not retrieve email from Heroku API"
            exit 1
          fi
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          machine git.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          EOF
          chmod 600 ~/.netrc
          cat ~/.netrc
          heroku git:remote -a polydan
          git push heroku HEAD:main 